on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  release:
    types:
      - created

name: Package CI
jobs:
  install:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build package
        run: npm run build
      - name: Run tests
        run: npm run test:coverage
      - name: Run linter
        run: npm run check:code
      - name: Run prettifier
        run: npm run check:prettier
      - name: Report Coverage
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # @master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        uses: decentraland/oddish-action@0074f2d535c43b5c83f136525304a6277166d77f # @master
        with:
          access: public
          ## Sign the deployment
          provenance: true
        env:
